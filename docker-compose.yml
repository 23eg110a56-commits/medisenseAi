version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: medisense_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - medisense_network

  postgres:
    image: postgres:16-alpine
    container_name: medisense_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=medisense_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init_postgres.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - medisense_network

  backend:
    build: ./backend
    container_name: medisense_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=medisense_ai
      - POSTGRES_URL=postgresql://postgres:postgres@postgres:5432/medisense_ai
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
      - postgres
    volumes:
      - ./backend:/app
      - medisense_kb:/app/knowledge_base
    networks:
      - medisense_network

  frontend:
    build: ./frontend
    container_name: medisense_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - medisense_network

networks:
  medisense_network:
    driver: bridge

volumes:
  mongodb_data:
  postgres_data:
  medisense_kb:
